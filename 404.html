<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | LocalBoost</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  :root{--bg:#FAF9F6;--text:#1E1E1E;--muted:#5A5A54;--primary:#0F766E;--accent:#E8722C;--border:#E2E0D9}
  @media (prefers-color-scheme:dark){:root{--bg:#0F1412;--text:#EEF2F0;--muted:#A9B4AF;--primary:#3CC4B6;--border:#26302C}}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;padding:24px;text-align:center}
  h1{font-size:28px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}
  .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  a{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--border);color:var(--text);text-decoration:none;font-weight:600}
  a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<main>
  <h1>We couldn't find that page</h1>
  <p>The link may be old or mistyped. Try one of these instead.</p>
  <div class="links">
    <a class="primary" href="/check/">Free Google visibility check</a>
    <a href="/">Home</a>
    <a href="/tools/">Free tools</a>
    <a href="/blog/">Blog</a>
    <a href="/hi/">हिंदी</a>
  </div>
</main>
</body>
</html>
