name = "localboost-api"
main = "src/index.js"
compatibility_date = "2026-09-30"

# Logs + traces in the Cloudflare dashboard. The code never logs tokens or customer payloads.
[observability]
enabled = true

# ---------------------------------------------------------------------------
# Non-secret variables. Secrets are NEVER put here: use `wrangler secret put NAME`
# (full list in DEPLOYMENT-CHECKLIST.md).
# ---------------------------------------------------------------------------
[vars]
# Comma-separated browser origins allowed for CORS and the Origin check on non-GET requests.
ALLOWED_ORIGINS = "https://localboost.in,https://www.localboost.in"
# Must match the redirect URI registered in Google Cloud exactly.
GOOGLE_REDIRECT_URI = "https://api.localboost.in/auth/google/callback"

# Optional feature flags / tuning. All default to OFF/unset when absent. Uncomment only after
# the matching provider is configured and verified in production. Never set to "true" to fake data.
# GOOGLE_REVIEWS_SYNC_ENABLED = "true"       # scheduled Google reviews sync (needs GBP API approval)
# GOOGLE_PERFORMANCE_SYNC_ENABLED = "true"   # scheduled GBP Performance API sync
# SEARCH_CONSOLE_SYNC_ENABLED = "true"       # scheduled Search Console sync
# GOOGLE_RETRY_BASE_MS = "500"               # base back-off for Google API retries
# PAYMENT_PROVIDER_ENABLED = "true"          # enables paid checkout (requires RAZORPAY_* secrets)
# PAYMENT_PROVIDER_NAME = "razorpay"
# RANK_PROVIDER_ENABLED = "true"             # enables local rank scans (requires RANK_PROVIDER_TOKEN secret)
# RANK_PROVIDER_URL = "https://rank-provider.example/v1/rank"  # compliant rank data provider endpoint
# RANK_PROVIDER_NAME = "configured_provider" # label stored with each scan
# RANK_COST_PER_POINT_MINOR = "0"            # estimated cost per grid point, minor units; shown in admin metrics
# RANK_RETRY_DELAY_MS = "800"                # delay between rank provider retries

# Create the D1 database first, then replace this placeholder with its real ID
# (`npx wrangler d1 create localboost` prints it).
[[d1_databases]]
binding = "DB"
database_name = "localboost"
database_id = "REPLACE_WITH_D1_DATABASE_ID" # REQUIRED: replace before production deploy

# Hourly cron: monitoring sync plus module jobs (retention cleanup, analytics rollup).
[triggers]
crons = ["0 * * * *"]

# Custom domain (api.localboost.in) is attached in the Cloudflare dashboard or by uncommenting:
# routes = [{ pattern = "api.localboost.in", custom_domain = true }]
