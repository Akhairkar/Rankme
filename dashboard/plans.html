<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plans | LocalBoost</title><style>body{font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;margin:0}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:22px;margin:16px 0}.muted{color:#666}a{display:inline-block;padding:11px 16px;border-radius:8px;background:#0f766e;color:#fff;text-decoration:none}</style></head><body><main class="wrap"><p class="muted">LOCALBOOST</p><h1>Plan & access</h1><div class="card"><h2 id="plan">Checking plan…</h2><p id="status" class="muted">Subscription access is determined by verified billing status.</p><p id="limits"></p><a href="../pricing/index.html">View plans</a></div><p><a href="./index.html">← Dashboard</a></p></main><script src="../assets/localboost-api-config.js"></script><script>(async()=>{const c=window.LOCALBOOST_API||{},b=(c.baseUrl||"").replace(/\/$/,"");if(!c.enabled||!b){plan.textContent="Free access";status.textContent="Production billing is not enabled yet.";return}try{const r=await fetch(b+"/api/entitlements",{credentials:"include"});if(!r.ok)throw 0;const d=await r.json();plan.textContent=(d.plan_code||"free").toUpperCase()+" plan";status.textContent=d.status==="free"?"No active paid subscription.":"Subscription status: "+d.status;limits.textContent="Businesses: "+d.max_businesses+" · Locations: "+d.max_locations+" · Keywords: "+d.max_keywords}catch(_){plan.textContent="Plan unavailable";status.textContent="Could not verify subscription status."}})()</script></body></html>
