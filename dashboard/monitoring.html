<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoring & Alerts | LocalBoost</title><meta name="robots" content="noindex,follow"><style>:root{--bg:#f6f8fb;--card:#fff;--text:#102033;--muted:#657487;--line:#dfe6ee;--brand:#0f766e;--soft:#eef8f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:22px 16px}.top{display:flex;justify-content:space-between;margin-bottom:30px}.brand{font-weight:850;font-size:19px}.back{color:var(--muted);text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:25px}.eyebrow{font-size:11px;letter-spacing:.1em;font-weight:850;color:var(--brand)}h1{font-size:30px;margin:7px 0}.lead,.muted{color:var(--muted)}.notice{margin:18px 0;padding:14px;border-radius:10px;background:var(--soft);color:#135e58}.event{padding:16px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event strong{display:block}.meta{font-size:12px;color:var(--muted);margin-top:4px}.empty{text-align:center;padding:25px;color:var(--muted)}.tag{display:inline-block;margin-top:7px;padding:3px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:800}@media(max-width:600px){.card{padding:20px}h1{font-size:27px}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="../index.html">LocalBoost</a><a class="back" href="./">← Dashboard</a></header><main class="card"><div class="eyebrow">MONITORING</div><h1>Monitoring & alerts</h1><p class="lead">Keep track of verified changes affecting local visibility. Alerts appear only when LocalBoost has measured a real business-specific event.</p><div id="notice" class="notice">Loading monitoring status…</div><section id="events"><div class="empty">Loading…</div></section></main></div><script src="../assets/localboost-api-config.js"></script><script>
(async()=>{const cfg=window.LOCALBOOST_API||{},base=(cfg.baseUrl||"").replace(/\/$/,""),bid=sessionStorage.getItem("localboost_business_id"),notice=document.querySelector("#notice"),events=document.querySelector("#events");if(!cfg.enabled||!base||!bid){notice.textContent="Production monitoring is pending. No alerts are fabricated.";events.innerHTML="<div class='empty'>Connect the production API and a verified business to load monitoring events.</div>";return}try{const r=await fetch(base+"/api/monitoring?business_id="+encodeURIComponent(bid),{credentials:"include"});const d=await r.json();if(!r.ok)throw new Error(d.error||"Monitoring unavailable");if(!d.events?.length){notice.textContent="No verified monitoring events yet.";events.innerHTML="<div class='empty'>Monitoring is ready. Events will appear after verified measurements are available.</div>";return}notice.textContent=d.events.length+" verified monitoring event"+(d.events.length===1?"":"s")+" available.";events.innerHTML=d.events.map(e=>"<article class='event'><strong>"+esc(e.title)+"</strong><div class='meta'>"+new Date(Number(e.detected_at)).toLocaleString()+" · "+esc(e.event_type)+" · "+esc(e.status)+"</div><span class='tag'>"+esc(e.severity)+"</span>"+(e.detail?"<p class='muted' style='margin-top:7px'>"+esc(e.detail)+"</p>":"")+"</article>").join("")}catch(e){notice.textContent=e.message;events.innerHTML="<div class='empty'>Monitoring data could not be loaded.</div>"}})();function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</script></body></html>
