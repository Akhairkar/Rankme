<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Where LocalBoost data comes from</title><desc id="d">Your own business details, your website, and accounts you choose to connect flow into LocalBoost, which produces an audit, a fix list and tracking.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#85837B"/></marker></defs><rect width="1000" height="420" rx="20" fill="#FFFFFF" stroke="#E2E0D9" stroke-width="2"/><text x="40" y="46" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="700" font-size="14" fill="#5A5A54" letter-spacing="1">YOUR INPUTS</text><text x="640" y="46" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="700" font-size="14" fill="#5A5A54" letter-spacing="1">YOU GET</text><rect x="40" y="64" width="270" height="68" rx="12" fill="#FAF9F6" stroke="#E2E0D9" stroke-width="2"/><text x="60" y="93" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="17" fill="#1E1E1E">Details you enter</text><text x="60" y="115" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="13" fill="#5A5A54">Business name, city, category</text><path d="M310 98C350 98 350 210 392 210" fill="none" stroke="#85837B" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="148" width="270" height="68" rx="12" fill="#FAF9F6" stroke="#E2E0D9" stroke-width="2"/><text x="60" y="177" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="17" fill="#1E1E1E">Your website</text><text x="60" y="199" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="13" fill="#5A5A54">Public pages, fetched on request</text><path d="M310 182C350 182 350 210 392 210" fill="none" stroke="#85837B" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="232" width="270" height="68" rx="12" fill="#FAF9F6" stroke="#E2E0D9" stroke-width="2"/><text x="60" y="261" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="17" fill="#1E1E1E">Accounts you connect</text><text x="60" y="283" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="13" fill="#5A5A54">Google sign-in, you stay in control</text><path d="M310 266C350 266 350 210 392 210" fill="none" stroke="#85837B" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="316" width="270" height="68" rx="12" fill="#FAF9F6" stroke="#E2E0D9" stroke-width="2"/><text x="60" y="345" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="17" fill="#1E1E1E">Public speed data</text><text x="60" y="367" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="13" fill="#5A5A54">Page speed measurements</text><path d="M310 350C350 350 350 210 392 210" fill="none" stroke="#85837B" stroke-width="2.5" marker-end="url(#a)"/><rect x="394" y="150" width="212" height="120" rx="20" fill="#0F766E"/><text x="500" y="200" text-anchor="middle" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="24" fill="#fff">LocalBoost</text><text x="500" y="228" text-anchor="middle" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="14" fill="#D5F0EC">checks &amp; explains</text><path d="M606 210C640 210 640 128 676 128" fill="none" stroke="#85837B" stroke-width="2.5" marker-end="url(#a)"/><rect x="680" y="94" width="280" height="68" rx="12" fill="#E0F5F2" stroke="#A5DDD6" stroke-width="2"/><text x="700" y="123" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="17" fill="#0B5F58">Audit</text><text x="700" y="145" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="13" fill="#1E1E1E">What is missing, with evidence</text><path d="M606 210C640 210 640 228 676 228" fill="none" stroke="#85837B" stroke-width="2.5" marker-end="url(#a)"/><rect x="680" y="194" width="280" height="68" rx="12" fill="#E0F5F2" stroke="#A5DDD6" stroke-width="2"/><text x="700" y="223" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="17" fill="#0B5F58">Fix list</text><text x="700" y="245" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="13" fill="#1E1E1E">Steps in priority order</text><path d="M606 210C640 210 640 328 676 328" fill="none" stroke="#85837B" stroke-width="2.5" marker-end="url(#a)"/><rect x="680" y="294" width="280" height="68" rx="12" fill="#E0F5F2" stroke="#A5DDD6" stroke-width="2"/><text x="700" y="323" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="800" font-size="17" fill="#0B5F58">Tracking</text><text x="700" y="345" font-family="Manrope,Inter,'Noto Sans Devanagari',Arial,sans-serif" font-weight="500" font-size="13" fill="#1E1E1E">Re-checks over time</text></svg>