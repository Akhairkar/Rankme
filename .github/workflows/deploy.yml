name: Deploy
# Runs on main only. Deploys the static site to Cloudflare Pages and the API Worker.
# Requires repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Worker secrets (GOOGLE_*, RAZORPAY_*, ...) are set once with `wrangler secret put`, never in CI.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  site:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: cfg
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Build dist
        run: python3 scripts/build_dist.py
      - name: Deploy to Cloudflare Pages
        if: steps.cfg.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=localboost --branch=main
      - name: Skipped (no Cloudflare secrets)
        if: steps.cfg.outputs.ok != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; build succeeded but nothing was deployed."
  api:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy Worker
        if: steps.cfg.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
